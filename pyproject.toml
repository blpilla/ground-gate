[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "groundgate"
version = "0.1.0"
description = "Runtime faithfulness gate for RAG: claim-by-claim grounding verification, exposed as a Python SDK and an MCP server."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Bruno Pilla", email = "blpilla@gmail.com" }]
keywords = [
    "rag",
    "hallucination",
    "faithfulness",
    "grounding",
    "mcp",
    "llm",
    "guardrails",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Zero runtime dependencies by design. LLM judges are optional extras.
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]
bedrock = ["boto3>=1.34"]
http = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.urls]
Homepage = "https://github.com/blpilla/groundgate"

[project.scripts]
groundgate = "groundgate.cli:main"

[tool.setuptools.packages.find]
include = ["groundgate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
